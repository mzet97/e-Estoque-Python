[project]
name = "e-estoque"
version = "0.1.0"
description = "e-Estoque API — Python/FastAPI migration of e-Estoque-API (.NET 8)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.129",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31",
    "alembic>=1.19",
    "redis>=7.0",
    "aio-pika>=9.8",
    "pyjwt[crypto]>=2.12",
    "httpx>=0.28",
    "prometheus-client>=0.24",
    "odata-query>=0.10,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "testcontainers[postgres]>=4.13",
    "greenlet>=3.2",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e_estoque"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "TRY"]
ignore = ["TRY003", "B008"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/e_estoque"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["pragma: no cover"]

[tool.pytest.ini_options.env]
EESTOQUE_SETTINGS_SKIP = "1"
