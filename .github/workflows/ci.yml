name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format
        run: uv run ruff format --check src tests scripts

      - name: mypy (strict)
        run: uv run mypy src

      - name: Architecture + unit + API tests (coverage)
        run: uv run pytest tests --cov=e_estoque --cov-branch --cov-fail-under=80

      - name: Alembic offline SQL validation
        run: |
          uv run alembic upgrade head --sql > /tmp/alembic.sql
          grep -q 'CREATE TABLE public."Products"' /tmp/alembic.sql

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e-estoque
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      EESTOQUE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/e-estoque
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Apply Alembic migration on real PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify schema parity artifacts
        run: |
          psql postgresql://postgres:postgres@localhost:5432/e-estoque \
            -c "\dt" | grep -E 'Categories|Companies|Customers|Products|inventories|Sales|SaleProducts|Taxs'
      - name: Docker build
        run: docker build -t e-estoque-py .
