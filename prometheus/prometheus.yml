global:
  scrape_interval: 15s
  external_labels:
    cluster: e-estoque-py-cluster
    environment: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: e-estoque-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
